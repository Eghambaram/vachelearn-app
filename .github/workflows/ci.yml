name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (format, lint, typecheck, test, build) + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # API integration tests run against a real PostgreSQL (testing rules: the database is never mocked).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vachelearn
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_DB: vachelearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vachelearn -d vachelearn_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # SMTP sink for the email job tests (same image as infra/docker-compose.yml).
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://vachelearn:ci-only-placeholder@localhost:5432/vachelearn_test
      MAILPIT_URL: http://127.0.0.1:8025
      MAILPIT_SMTP_PORT: '1025'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (production dependencies, high and critical)
        run: pnpm audit --prod --audit-level high

      - name: All gates
        run: pnpm verify

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: End-to-end smoke + accessibility
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
